<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapeo estructural · IACON — TERRAM</title>
<style>
:root{
  --paper:#F4F6F5; --card:#FFFFFF; --ink:#14201E; --ink2:#4A5956; --ink3:#7C8B87;
  --rule:#CBD3D0; --rule2:#E3E8E6; --teal:#14514D; --teal2:#0F403D; --tealsoft:#E3EDEB;
  --leve:#2F7A52; --moderado:#A8821A; --severo:#B85A25; --grave:#96211F;
  --warn:#FDF3E3; --warnink:#7A5310;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
.app{padding-bottom:104px}

/* shell */
.topbar{position:sticky;top:0;z-index:60;background:var(--teal);color:#fff}
.topbar .wrap{display:flex;align-items:center;gap:10px;padding:9px 14px}
.back{background:rgba(255,255,255,.16);border:none;color:#fff;font:inherit;font-size:20px;line-height:1;
  width:34px;height:34px;border-radius:8px;cursor:pointer;flex:none;padding:0}
.tt{flex:1;min-width:0}
.tt h1{font-size:15px;font-weight:650;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt p{font-size:12.5px;margin:0;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.syncdot{font-size:11.5px;font-family:var(--mono);background:rgba(255,255,255,.16);padding:5px 8px;border-radius:6px;
  cursor:pointer;border:none;color:#fff;flex:none}
.crumb{background:var(--teal2);color:#CFE0DE;font-size:12.5px;padding:6px 0}
.crumb .wrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:#fff;font-weight:600}
.notice{background:var(--warn);color:var(--warnink);border-bottom:1px solid #E9D6AE;font-size:13.5px;padding:9px 0;display:none}
.conf{background:#26302E;color:#B9C6C3;font-size:11.5px;padding:7px 0;text-align:center;letter-spacing:.01em}

/* tabs */
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--rule2);position:sticky;top:52px;z-index:50}
.tabs button{flex:1;font:inherit;font-size:13.5px;font-weight:600;padding:12px 4px;background:none;border:none;
  color:var(--ink3);cursor:pointer;border-bottom:2.5px solid transparent}
.tabs button[aria-selected="true"]{color:var(--teal);border-bottom-color:var(--teal)}

/* bloques */
section{background:var(--card);border:1px solid var(--rule2);border-radius:10px;margin:14px 0;overflow:hidden}
section>h2{font-size:13px;font-weight:650;margin:0;padding:11px 14px;border-bottom:1px solid var(--rule2);background:#F8FAF9;color:var(--ink2)}
.body{padding:14px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 5px}
.hint{font-size:12px;color:var(--ink3);font-weight:400;margin:-2px 0 6px}
.field{margin-bottom:14px}.field:last-child{margin-bottom:0}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;
  border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink);appearance:none;-webkit-appearance:none}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%234A5956' stroke-width='2'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
textarea{min-height:74px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid rgba(20,81,77,.35);outline-offset:1px;border-color:var(--teal)}
.mono{font-family:var(--mono);letter-spacing:.02em}

.seg{display:grid;gap:7px}
.seg.c4{grid-template-columns:repeat(4,1fr)}.seg.c3{grid-template-columns:repeat(3,1fr)}.seg.c2{grid-template-columns:repeat(2,1fr)}
.seg button{font:inherit;font-size:13.5px;font-weight:600;padding:13px 4px;border-radius:8px;cursor:pointer;
  border:1.5px solid var(--rule);background:#fff;color:var(--ink2);min-height:52px;line-height:1.2}
.seg button[aria-pressed="true"]{color:#fff;border-color:transparent;background:var(--teal)}
.seg button[data-v="Leve"][aria-pressed="true"]{background:var(--leve)}
.seg button[data-v="Moderado"][aria-pressed="true"]{background:var(--moderado)}
.seg button[data-v="Severo"][aria-pressed="true"]{background:var(--severo)}
.seg button[data-v="Grave"][aria-pressed="true"]{background:var(--grave)}
.checks{display:grid;gap:2px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;font-weight:400;color:var(--ink);
  padding:9px 2px;margin:0;cursor:pointer;border-bottom:1px solid var(--rule2)}
.checks label:last-child{border-bottom:none}
.checks input{width:21px;height:21px;margin:1px 0 0;flex:none;accent-color:var(--teal)}
.split{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:560px){.split{grid-template-columns:1fr 1fr}}
.split h3{font-size:12.5px;font-weight:650;margin:0 0 4px;color:var(--ink2);padding-bottom:6px;border-bottom:2px solid var(--rule)}
.split .sis h3{border-color:var(--severo);color:var(--severo)}

/* botones */
.btn{font:inherit;font-size:15px;font-weight:650;border-radius:9px;padding:14px 16px;cursor:pointer;
  border:1.5px solid var(--teal);background:#fff;color:var(--teal)}
.btn.primary{background:var(--teal);color:#fff}
.btn.ghost{border-color:var(--rule);color:var(--ink2)}
.btn.danger{border-color:#D9B3B2;color:var(--grave)}
.btn.small{padding:9px 12px;font-size:13.5px;border-radius:7px}
.btn.block{display:block;width:100%}
.tools{display:flex;flex-wrap:wrap;gap:7px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(244,246,245,.96);
  backdrop-filter:blur(8px);border-top:1px solid var(--rule);padding:10px 0 max(10px,env(safe-area-inset-bottom))}
.actionbar .wrap{display:flex;gap:9px}
.actionbar .btn{flex:1}

/* listas */
.item{display:flex;gap:11px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--rule2);cursor:pointer;background:#fff}
.item:last-child{border-bottom:none}
.item:hover{background:#F8FAF9}
.item .bar{width:4px;align-self:stretch;border-radius:2px;flex:none;background:var(--rule)}
.item[data-s="Leve"] .bar{background:var(--leve)}
.item[data-s="Moderado"] .bar{background:var(--moderado)}
.item[data-s="Severo"] .bar{background:var(--severo)}
.item[data-s="Grave"] .bar{background:var(--grave)}
.item .txt{flex:1;min-width:0}
.item .code{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.item .ttl{font-size:15px;font-weight:600;margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .n{font-size:11.5px;color:var(--ink3);font-family:var(--mono);flex:none;text-align:right}
.empty{padding:28px 16px;text-align:center;color:var(--ink3);font-size:14px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:20px;
  background:var(--tealsoft);color:var(--teal);margin-right:5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:14px}
.stat{text-align:center;padding:10px 4px;border-radius:8px;background:#F8FAF9;border:1px solid var(--rule2)}
.stat b{display:block;font-size:20px;font-weight:650;line-height:1.15}
.stat span{font-size:11px;color:var(--ink2)}
.stat.leve b{color:var(--leve)}.stat.moderado b{color:var(--moderado)}
.stat.severo b{color:var(--severo)}.stat.grave b{color:var(--grave)}

/* fotos */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;margin-top:12px}
.shot{position:relative;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:#EDF0EF}
.shot img{display:block;width:100%;height:88px;object-fit:cover}
.shot input{width:100%;border:none;border-top:1px solid var(--rule2);font-size:12px;padding:7px 8px;border-radius:0}
.shot .del{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;border:none;
  background:rgba(10,20,18,.72);color:#fff;font-size:16px;line-height:1;cursor:pointer;padding:0}
.addshot{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:54px;font:inherit;
  font-size:15px;font-weight:600;border:1.5px dashed var(--teal);background:var(--tealsoft);color:var(--teal);
  border-radius:9px;cursor:pointer}

/* plano */
.planowrap{position:relative;background:#E8ECEB;border-radius:8px;overflow:auto;max-height:64vh;touch-action:pan-x pan-y}
.planoinner{position:relative;display:inline-block;min-width:100%}
.planoinner img{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-100%);cursor:pointer;background:none;border:none;padding:0}
.pin i{display:block;width:26px;height:26px;border-radius:50% 50% 50% 2px;transform:rotate(45deg);
  background:var(--teal);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin[data-s="Leve"] i{background:var(--leve)}.pin[data-s="Moderado"] i{background:var(--moderado)}
.pin[data-s="Severo"] i{background:var(--severo)}.pin[data-s="Grave"] i{background:var(--grave)}
.pin b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:10.5px;font-family:var(--mono);font-weight:700;pointer-events:none}
.placing{outline:3px solid var(--teal);outline-offset:-3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hide{display:none!important}


/* captura rápida */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:13.5px;font-weight:600;padding:10px 13px;border-radius:22px;
  border:1.5px solid var(--rule);background:#fff;color:var(--ink2);cursor:pointer;min-height:44px;line-height:1.15}
.chips button[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:transparent}
.chips button.more{border-style:dashed;color:var(--teal);border-color:var(--teal)}
.chips button.more[aria-pressed="true"]{background:var(--teal);color:#fff;border-style:solid}
.bigshot{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;min-height:96px;
  font:inherit;font-size:16px;font-weight:650;border:2px dashed var(--teal);background:var(--tealsoft);
  color:var(--teal);border-radius:12px;cursor:pointer}
.bigshot.has{min-height:58px;font-size:14.5px;border-style:solid;background:#fff}
.qf{padding:14px}
.qf .grp{margin-bottom:15px}
.qf .grp:last-child{margin-bottom:0}
.qf .lbl{font-size:12.5px;font-weight:650;color:var(--ink3);margin-bottom:7px}
.qf .lbl em{font-style:normal;color:var(--severo);font-weight:650}
.inh{font-size:11.5px;color:var(--ink3);font-weight:400;font-style:italic}
.exp{width:100%;text-align:left;font:inherit;font-size:14px;font-weight:650;color:var(--teal);
  background:#F8FAF9;border:none;border-top:1px solid var(--rule2);padding:15px 14px;cursor:pointer;
  display:flex;gap:9px;align-items:center}
.exp .ar{display:inline-block;transition:transform .15s;font-size:12px}
.exp[aria-expanded="true"] .ar{transform:rotate(90deg)}

/* resumen */
.mrow{display:flex;align-items:center;gap:9px;padding:9px 14px;border-bottom:1px solid var(--rule2);font-size:14px}
.mrow:last-child{border-bottom:none}
.mrow .lb{flex:none;width:40%;color:var(--ink2);font-size:13.5px;line-height:1.25}
.mrow .tr{flex:1;height:9px;background:#EDF0EF;border-radius:5px;overflow:hidden}
.mrow .tr i{display:block;height:100%;background:var(--teal);border-radius:5px}
.mrow .vn{flex:none;font-family:var(--mono);font-size:12px;color:var(--ink2);width:62px;text-align:right}
.mrow[data-c="Leve"] .tr i{background:var(--leve)}
.mrow[data-c="Moderado"] .tr i{background:var(--moderado)}
.mrow[data-c="Severo"] .tr i{background:var(--severo)}
.mrow[data-c="Grave"] .tr i{background:var(--grave)}
.mrow[data-c="Sísmico"] .tr i{background:var(--severo)}
.mrow[data-c="Preexistente"] .tr i{background:var(--ink3)}
.mrow[data-c="Indeterminado"] .tr i{background:var(--moderado)}
.mrow[data-c="Restringido"] .tr i{background:var(--grave)}
.mrow[data-c="Uso inmediato"] .tr i{background:var(--leve)}
.alert{background:#FCF0EF;border:1px solid #E8C9C7;border-radius:10px;padding:13px 14px;margin:14px 0}
.alert h4{margin:0 0 5px;font-size:13.5px;color:var(--grave)}
.alert p{margin:0;font-size:13.5px;color:var(--ink2)}
.qc{font-size:14px;padding:11px 14px;border-bottom:1px solid var(--rule2);display:flex;gap:11px;align-items:baseline}
.qc:last-child{border-bottom:none}
.qc b{flex:none;font-family:var(--mono);font-size:13px;min-width:26px;text-align:right}
.qc.ok b{color:var(--leve)}
.qc.bad b{color:var(--severo)}
.qc.bad span{color:var(--ink)}
.qc.ok span{color:var(--ink3)}

/* impresión */
#print{display:none}
@media print{
  body{background:#fff;font-size:10.5pt}
  .app,.topbar,.crumb,.actionbar,.notice,.conf,.tabs{display:none!important}
  #print{display:block!important}
  .cedula{page-break-after:always;padding:0;position:relative}
  .cedula:last-child{page-break-after:auto}
  @page{size:letter portrait;margin:14mm 13mm 18mm}
}
#print .cedula{max-width:700px;margin:0 auto 26px;background:#fff;padding:18px;border:1px solid #999}
.ch{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2.5px solid var(--teal);padding-bottom:8px;margin-bottom:10px}
.ch .l{font-size:9.5pt;line-height:1.35}
.ch .l b{font-size:11.5pt;display:block}
.ch .r{text-align:right}
.ch .r .code{font-family:var(--mono);font-size:15pt;font-weight:700;letter-spacing:.03em;display:block}
.ch .r .sev{display:inline-block;color:#fff;font-size:9pt;font-weight:700;padding:2px 9px;border-radius:3px;margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.kv{display:flex;gap:7px;font-size:9.5pt;padding:3.5px 0;border-bottom:1px dotted #C9D0CE;align-items:baseline}
.kv .k{color:#55635F;flex:none;width:36%;font-weight:600}
.kv .v{flex:1}
.blk{margin-top:11px}
.blk h4{font-size:9pt;font-weight:700;color:var(--teal);margin:0 0 5px;padding-bottom:3px;border-bottom:1px solid var(--rule)}
.blk p{margin:0;font-size:9.5pt;line-height:1.42}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:7px}
.pgrid figure{margin:0}
.pgrid img{width:100%;height:118px;object-fit:cover;border:1px solid #B9C2BF}
.pgrid figcaption{font-size:8pt;color:#4A5956;padding-top:3px;line-height:1.3}
.cf{margin-top:14px;padding-top:7px;border-top:1px solid #B9C2BF;font-size:7.5pt;color:#55635F;line-height:1.4}
.wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  font-size:40pt;font-weight:800;color:rgba(20,81,77,.06);transform:rotate(-28deg);letter-spacing:.06em;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  try{ if(!window.indexedDB) return res(null);

    r.onupgradeneeded=function(e){var d=e.target.result;

      if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta")};
    r.onsuccess=function(e){res(e.target.result)}; r.onerror=function(){res(null)};
    setTimeout(function(){res(null)},2500);
  }catch(e){res(null)}})}
function all(n){return new Promise(function(res){ if(!DB)return res([]);
  try{var t=DB.transaction(n,"readonly").objectStore(n).getAll();
    t.onsuccess=function(){res(t.result||[])};t.onerror=function(){res([])}}catch(e){res([])}})}
function put(n,o){ if(!DB)return; try{DB.transaction(n,"readwrite").objectStore(n).put(o)}catch(e){} }
function del(n,id){ if(!DB)return; try{DB.transaction(n,"readwrite").objectStore(n).delete(id)}catch(e){} }
function mset(k,v){ if(!DB)return; try{DB.transaction("meta","readwrite").objectStore("meta").put(v,k)}catch(e){} }
function mget(k){return new Promise(function(res){ if(!DB)return res(null);
  try{var t=DB.transaction("meta","readonly").objectStore("meta").get(k);
    t.onsuccess=function(){res(t.result||null)};t.onerror=function(){res(null)}}catch(e){res(null)}})}

/* ========== sincronización ========== */
function hasSync(){return !!(window.storage&&window.storage.set)}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function pushAll(){
  if(!hasSync()){flash("Este equipo trabaja solo en modo local. Comparte por archivo de respaldo.");return}
  S.busy=true; paintSync("subiendo");
  var items=[].concat(
    S.proyectos.filter(function(x){return x._d}).map(function(x){return["p:"+x.id,x,"proyectos"]}),
    S.sedes.filter(function(x){return x._d}).map(function(x){return["s:"+x.id,x,"sedes"]}),
    S.fichas.filter(function(x){return x._d}).map(function(x){return["f:"+x.sedeId+":"+x.id,x,"fichas"]}));
  if(!items.length){S.busy=false;paintSync();flash("No hay cambios pendientes por subir.");return}
  var ok=0,fail=0;
  for(var i=0;i<items.length;i++){
    try{ await window.storage.set(items[i][0],JSON.stringify(items[i][1]),true);
      items[i][1]._d=false; put(items[i][2],items[i][1]); ok++;
    }catch(e){fail++}
    await sleep(120);
  }
  S.busy=false; paintSync();
  flash(ok+" elementos sincronizados"+(fail?", "+fail+" no se pudieron subir. Reintenta con señal estable.":"."));
  render();
}
async function pullAll(){
  if(!hasSync()){flash("Este equipo trabaja solo en modo local.");return}
  S.busy=true; paintSync("bajando");
  var got=0;
  try{
    for(var pre of [["p:","proyectos"],["s:","sedes"],["f:","fichas"]]){
      var ks=await window.storage.list(pre[0],true);
      var keys=(ks&&ks.keys)||[];
      for(var k of keys){
        try{ var r=await window.storage.get(k,true); if(!r)continue;
          var o=JSON.parse(r.value); o._d=false;
          var arr=S[pre[1]], j=arr.map(function(x){return x.id}).indexOf(o.id);
          var mine=j>=0?arr[j]:null;
          if(!mine || (o.ts||"")>(mine.ts||"")){ if(j>=0)arr[j]=o; else arr.push(o); put(pre[1],o); got++ }
        }catch(e){}
        await sleep(60);
      }
    }
  }catch(e){}
  S.busy=false; paintSync();
  flash(got?got+" elementos actualizados desde el repositorio compartido.":"Todo estaba al día.");
  render();
}
function paintSync(st){
  var b=$("syncBtn");
  if(st){b.textContent=st;return}
  if(ghOn()){
    var q=S.proyectos.concat(S.sedes,S.fichas).filter(function(x){return x._d}).length;
    b.textContent=q?("git ↑"+q):"git ✓"; return;
  }
  if(!hasSync()){b.textContent="local";return}
  var p=S.proyectos.concat(S.sedes,S.fichas).filter(function(x){return x._d}).length;
  b.textContent=p?("↑ "+p):"al día";
}
$("syncBtn").addEventListener("click",function(){
  if(S.busy)return;
  var pend=S.proyectos.concat(S.sedes,S.fichas).filter(function(x){return x._d}).length;
  if(ghOn()){
    if(confirm(pend?("Subir "+pend+" cambios al repositorio y traer lo del equipo?"):"Traer lo que haya subido el equipo?")) ghSync();
    return;
  }
  if(!hasSync()){flash("Configura el repositorio GitHub en la pantalla de proyectos, o usa exportar e importar respaldo.");return}
  if(confirm(pend?("Subir "+pend+" cambios y traer lo del equipo?"):"Traer lo que hayan subido los demás?")){
    pushAll().then(pullAll);
  }
});


/* ========== repositorio GitHub ========== */
function ghOn(){return !!(S.gh&&S.gh.owner&&S.gh.repo&&S.gh.token)}
function ghBase(){return "https://api.github.com/repos/"+S.gh.owner+"/"+S.gh.repo}
function ghH(x){
  var o={"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  if(S.gh.token)o["Authorization"]="Bearer "+S.gh.token;
  if(x)for(var k in x)o[k]=x[k];
  return o;
}
function sb64(s){var b=new TextEncoder().encode(s),x="";
  for(var i=0;i<b.length;i+=0x8000)x+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(x)}
function b64s(c){var r=atob(String(c).replace(/\s/g,"")),u=new Uint8Array(r.length);
  for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return new TextDecoder().decode(u)}
function ghRoot(){return String(S.gh.path||"datos").replace(/^\/+|\/+$/g,"")}
function ghPath(kind,o){
  var r=ghRoot();
  if(kind==="proyectos")return r+"/proyectos/"+o.id+".json";
  if(kind==="sedes")return r+"/sedes/"+o.id+".json";
  return r+"/fichas/"+o.sedeId+"/"+o.id+".json";
}
async function ghTree(){
  var r=await fetch(ghBase()+"/git/trees/"+encodeURIComponent(S.gh.branch||"main")+"?recursive=1",{headers:ghH()});
  if(r.status===409)return {};
  if(r.status===401||r.status===403)throw new Error("El token no tiene acceso a ese repositorio.");
  if(r.status===404)throw new Error("No se encontró el repositorio. Revisa usuario, nombre y rama.");
  if(!r.ok)throw new Error("GitHub respondió "+r.status);
  var d=await r.json(),m={};
  (d.tree||[]).forEach(function(t){if(t.type==="blob")m[t.path]=t.sha});
  return m;
}
async function ghBlob(sha){
  var r=await fetch(ghBase()+"/git/blobs/"+sha,{headers:ghH()});
  if(!r.ok)throw new Error("blob "+r.status);
  var d=await r.json(); return b64s(d.content||"");
}
async function ghPutFile(path,text,sha){
  var body={message:"mapeo · "+path.split("/").pop()+" · "+(S.usuario||"equipo"),
    content:sb64(text),branch:S.gh.branch||"main"};
  if(sha)body.sha=sha;
  var r=await fetch(ghBase()+"/contents/"+path.split("/").map(encodeURIComponent).join("/"),
    {method:"PUT",headers:ghH({"Content-Type":"application/json"}),body:JSON.stringify(body)});
  if(!r.ok){
    var t=await r.text();
    if(r.status===401||r.status===403)
      throw new Error("El token no tiene permiso de escritura. En GitHub: Settings > Developer settings > Fine-grained tokens > tu token > Permissions > Contents = Read and write. Si el repositorio es de una organización, además debe habilitar los tokens de grano fino.");
    if(r.status===404)
      throw new Error("No se encontró la rama \""+(S.gh.branch||"main")+"\" en el repositorio. Revisa el nombre de la rama.");
    if(r.status===409||r.status===422)
      throw new Error("Conflicto al escribir un archivo. Vuelve a sincronizar.");
    if(r.status===413)
      throw new Error("Una ficha pesa demasiado para subirla. Reduce el número de fotografías de esa ficha.");
    throw new Error("GitHub respondió "+r.status+" · "+t.slice(0,140));
  }
  var d=await r.json(); return d.content&&d.content.sha;
}
function limpio(o){var c=JSON.parse(JSON.stringify(o));delete c._d;delete c._sha;return c}
async function ghSync(force){
  if(!ghOn()){flash("Falta configurar el repositorio en la pantalla de proyectos.");return}
  if(S.busy)return; S.busy=true;
  var subidos=0,bajados=0,fallos=0,tree,err="";
  try{
    paintSync("leyendo");
    tree=await ghTree();
  }catch(e){ S.busy=false; paintSync(); flash(e.message); return }

  /* subir lo propio */
  var items=force?[]:[].concat(
    S.proyectos.filter(function(x){return x._d}).map(function(x){return["proyectos",x]}),
    S.sedes.filter(function(x){return x._d}).map(function(x){return["sedes",x]}),
    S.fichas.filter(function(x){return x._d}).map(function(x){return["fichas",x]}));
  for(var i=0;i<items.length;i++){
    paintSync("↑ "+(items.length-i));
    var kind=items[i][0],o=items[i][1],pa=ghPath(kind,o);
    try{
      var nsha=await ghPutFile(pa,JSON.stringify(limpio(o)),tree[pa]||o._sha||null);
      o._d=false; o._sha=nsha; tree[pa]=nsha; put(kind,o); subidos++;
    }catch(e){fallos++; if(!err)err=e.message}
    await sleep(90);
  }

  /* bajar lo del equipo: solo archivos cuyo sha cambió */
  var mios={}; 
  S.proyectos.forEach(function(x){mios[ghPath("proyectos",x)]=x});
  S.sedes.forEach(function(x){mios[ghPath("sedes",x)]=x});
  S.fichas.forEach(function(x){mios[ghPath("fichas",x)]=x});
  var pend=Object.keys(tree).filter(function(pa){
    if(pa.indexOf(ghRoot()+"/")!==0||!/\.json$/.test(pa))return false;
    if(force)return true;
    var m=mios[pa]; return !m || m._sha!==tree[pa];
  });
  for(var j=0;j<pend.length;j++){
    paintSync("↓ "+(pend.length-j));
    var pa2=pend[j];
    try{
      var o2=JSON.parse(await ghBlob(tree[pa2]));
      var kind2=/\/proyectos\//.test(pa2)?"proyectos":(/\/sedes\//.test(pa2)?"sedes":"fichas");
      o2._d=false; o2._sha=tree[pa2];
      var arr=S[kind2],k=arr.map(function(x){return x.id}).indexOf(o2.id);
      var mine=k>=0?arr[k]:null;
      if(force||!mine||(o2.ts||"")>=(mine.ts||"")){ if(k>=0)arr[k]=o2; else arr.push(o2); put(kind2,o2); bajados++ }
      else if(mine){ mine._sha=tree[pa2]; put(kind2,mine) }
    }catch(e){fallos++; if(!err)err=e.message}
    await sleep(70);
  }
  S.busy=false; paintSync();
  if(fallos&&err) flash("Fallaron "+fallos+" de "+(items.length+pend.length)+". Motivo: "+err,true);
  else flash("Sincronizado · "+subidos+" subidos, "+bajados+" recibidos.");
  render();
}
async function ghProbar(){
  try{ var t=await ghTree();
    var n=Object.keys(t).filter(function(x){return /\.json$/.test(x)}).length;
    flash("Conexión correcta. El repositorio tiene "+n+" archivos de datos.");
  }catch(e){ flash(e.message) }
}

function shrink(file,max,q){return new Promise(function(res,rej){
  var fr=new FileReader();
  fr.onload=function(){var img=new Image();
    img.onload=function(){var M=max||1400,w=img.width,h=img.height;
      if(Math.max(w,h)>M){var k=M/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
      var cv=document.createElement("canvas");cv.width=w;cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);res({src:cv.toDataURL("image/jpeg",q||0.7),w:w,h:h})};
    img.onerror=rej;img.src=fr.result};
  fr.onerror=rej;fr.readAsDataURL(file)})}

var ESTRUCT=["Columna","Viga","Nudo viga-columna","Muro estructural","Losa o entrepiso","Escalera","Cubierta estructural","Cimentación"];
function resumen(s){
  var f=fichasDe(s.id);
  var r={total:f.length,sev:{},orig:{},hab:{},tipo:{},zona:{},ens:{},patol:{},danos:{},
    estruct:0,noEstruct:0,apuntala:[],restringido:[],muestras:[],sinFoto:0,sinSustento:0,sinPin:0};
  C.severidad.forEach(function(k){r.sev[k]=0});
  C.origen.forEach(function(k){r.orig[k]=0});
  C.habil.forEach(function(k){r.hab[k]=0});
  f.forEach(function(x){
    if(r.sev[x.severidad]!==undefined)r.sev[x.severidad]++;
    if(r.orig[x.origen]!==undefined)r.orig[x.origen]++;
    if(r.hab[x.habilitacion]!==undefined)r.hab[x.habilitacion]++;
    if(x.tipoEl)r.tipo[x.tipoEl]=(r.tipo[x.tipoEl]||0)+1;
    if(claseFicha(x)==="Estructural")r.estruct++;else r.noEstruct++;
    var ds=(x.danos&&x.danos.length)?x.danos:(x.tipoDano?[x.tipoDano]:[]);
    ds.forEach(function(d){r.danos[d]=(r.danos[d]||0)+1});
    if(x.zona)r.zona[x.zona]=(r.zona[x.zona]||0)+1;
    (x.ensayos||[]).forEach(function(e){r.ens[e]=(r.ens[e]||0)+1});
    (x.patologia||[]).forEach(function(e){r.patol[e]=(r.patol[e]||0)+1});
    if(x.apuntalamiento==="Requiere ya")r.apuntala.push(x);
    if(x.habilitacion==="Restringido")r.restringido.push(x);
    if(x.muestra)r.muestras.push(x);
    if(!(x.fotos||[]).length)r.sinFoto++;
    if(!x.sustento)r.sinSustento++;
    if(!x.pin)r.sinPin++;
  });
  var vistos={}; r.dupes=0;
  f.forEach(function(x){ if(vistos[x.consec])r.dupes++; vistos[x.consec]=1 });
  return r;
}
function bars(obj,total){
  var ks=Object.keys(obj).filter(function(k){return obj[k]>0});
  if(!ks.length)return '<p class="empty">Sin datos registrados.</p>';
  ks.sort(function(a,b){return obj[b]-obj[a]});
  return ks.map(function(k){
    var pc=total?Math.round(obj[k]*100/total):0;
    return '<div class="mrow" data-c="'+esc(k)+'"><span class="lb">'+esc(k)+'</span>'+
      '<span class="tr"><i style="width:'+pc+'%"></i></span>'+
      '<span class="vn">'+obj[k]+' · '+pc+'%</span></div>'}).join("");
}
function qcRow(ok,n,txt){
  return '<div class="qc '+(ok?"ok":"bad")+'"><b>'+(ok?"✓":n)+'</b><span>'+esc(txt)+'</span></div>';
}
function itemMini(p,s,x){
  return '<div class="item" data-s="'+esc(x.severidad)+'" data-go=\'{"v":"ficha","pid":"'+p.id+'","sid":"'+s.id+'","fid":"'+x.id+'"}\'>'+
    '<div class="bar"></div><div class="txt"><div class="code">'+esc(x.codigo)+'</div>'+
    '<div class="ttl">'+esc([x.tipoEl,x.rotulo].filter(Boolean).join(" ")||"Elemento")+'</div>'+
    '<div class="sub">'+esc([x.nivel,x.zona,x.tipoDano].filter(Boolean).join(" · "))+'</div></div>'+
    '<div class="n">'+esc(x.severidad||"")+'</div></div>';
}

  h+='<section><h2>Control antes de radicar</h2>'+

    qcRow(r.sinPin===0,r.sinPin,"fichas sin localizar en el plano")+

    'Mientras haya marcas rojas, el Entregable 1 tiene vacíos que el Supervisor va a devolver.</p></div></section>';

function nextRotulo(r){
  if(!r)return "";
  var m=String(r).match(/^(.*?)(\d+)(\D*)$/); if(!m)return r;
  var n=String(parseInt(m[2],10)+1);
  while(n.length<m[2].length)n="0"+n;
  return m[1]+n+m[3];
}

  if(!gchips("qDanos").length){flash("Marca al menos una sintomatología. Si no hay daño, usa «Sin daño aparente».");return}
  if(!gseg("fSev")){flash("Falta la severidad.");return}
  if(!gseg("fOrig")){flash("Falta el origen atribuido. Es el campo que sostiene el dictamen.");return}
  var o={id:f.id||uid("f"),proyectoId:p.id,sedeId:s.id,consec:f.consec,codigo:f.codigo,insp:f.insp||S.insp.codigo,
    nivel:gv("fNivel"),eje:gv("fEje"),rotulo:gv("fRot"),zona:gv("fZona"),
    inspector:gv("fInsp"),fecha:gv("fFecha"),
    clase:gseg("fClase"),tipoEl:gv("qEl_s"),material:gv("fMat"),dim:gv("fDim"),
    danos:gchips("qDanos"),patrones:gchips("qPats"),
    tipoDano:(gchips("qDanos")[0]||""),patron:(gchips("qPats")[0]||""),
    ancho:gv("qAncho_s"),extension:gv("fExt"),
    severidad:gseg("fSev"),origen:gseg("fOrig"),indSis:gchk("fSis"),indPre:gchk("fPre"),sustento:gv("fSus"),
    patologia:gchk("fPatol"),habilitacion:gseg("fHab"),apuntalamiento:gseg("fApun"),
    ensayos:gchk("fEns"),muestra:gv("fMuestra"),obs:gv("fObs"),
    fotos:S.shots.slice(),pin:S.route._pin||f.pin||null,
    ts:new Date().toISOString(),_d:true};
  var hh=(f.hist||[]).slice(-9);
  hh.push({por:S.usuario||S.insp.codigo||"sin identificar",ts:new Date().toISOString(),acc:nuevo?"Levantamiento":"Modificación"});
  o.hist=hh;
  var i=S.fichas.map(function(x){return x.id}).indexOf(o.id);
  if(i>=0)S.fichas[i]=o; else S.fichas.push(o);
  put("fichas",o);
  if(nuevo){ S.seqs[s.id]=(f.consec||1)+1; mset("seqs",S.seqs) }
  S.route._pin=null;
  if(!S.usuario&&o.inspector){S.usuario=o.inspector;mset("usuario",o.inspector)}
  flash("Ficha "+o.codigo+" guardada.");
  if(nuevo&&!salir) go({v:"ficha",pid:p.id,sid:s.id,fid:null});
  else go({v:"sede",pid:p.id,sid:s.id,tab:"fichas"});
}

function resumenProyecto(p){
  var sd=sedesDe(p.id);
  var t={total:0,estruct:0,noEstruct:0,muestras:0,apuntala:0,restringido:0,sinPin:0,sinFoto:0,sinSustento:0,
    sev:{},orig:{},ens:{},porSede:[]};
  C.severidad.forEach(function(k){t.sev[k]=0});
  C.origen.forEach(function(k){t.orig[k]=0});
  sd.forEach(function(s){
    var r=resumen(s);
    t.total+=r.total; t.estruct+=r.estruct; t.noEstruct+=r.noEstruct;
    t.muestras+=r.muestras.length; t.apuntala+=r.apuntala.length; t.restringido+=r.restringido.length;
    t.sinPin+=r.sinPin; t.sinFoto+=r.sinFoto; t.sinSustento+=r.sinSustento;
    C.severidad.forEach(function(k){t.sev[k]+=r.sev[k]||0});
    C.origen.forEach(function(k){t.orig[k]+=r.orig[k]||0});
    Object.keys(r.ens).forEach(function(k){t.ens[k]=(t.ens[k]||0)+r.ens[k]});
    t.porSede.push({s:s,r:r});
  });
  return t;
}

  dl("mapeo_"+stamp()+".csv",new Blob(["\uFEFF"+COLS.map(function(c){return c[1]}).join(";")+"\n"+rows.join("\n")],

function expJson(){
  dl("respaldo_mapeo_"+stamp()+".json",new Blob([JSON.stringify({
    app:"Mapeo estructural IACON-TERRAM",exportado:new Date().toISOString(),usuario:S.usuario,
    proyectos:S.proyectos,sedes:S.sedes,fichas:S.fichas},null,1)],{type:"application/json"}));
}
$("fImport").addEventListener("change",function(e){
  var f=e.target.files[0]; if(!f)return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result), n=0;
      [["proyectos","proyectos"],["sedes","sedes"],["fichas","fichas"]].forEach(function(k){
        (d[k[0]]||[]).forEach(function(o){
          if(!o||!o.id)return;
          var arr=S[k[1]], j=arr.map(function(x){return x.id}).indexOf(o.id);
          var mine=j>=0?arr[j]:null;
          if(!mine||(o.ts||"")>(mine.ts||"")){ if(j>=0)arr[j]=o; else arr.push(o); put(k[1],o); n++ }
        })});
      flash(n+" elementos incorporados. Los más recientes prevalecen.");
      render();
    }catch(err){flash("El archivo no tiene el formato esperado. Usa un respaldo exportado desde esta plataforma.")}
    e.target.value="";
  };
  fr.readAsText(f);
});

});

/* ========== arranque ========== */
openDB().then(function(db){
  DB=db; S.syncMode=hasSync()?"compartido":"local";
  return Promise.all([all("proyectos"),all("sedes"),all("fichas"),mget("usuario"),mget("gh"),mget("insp"),mget("seqs")]);
}).then(function(r){
  S.proyectos=r[0]||[]; S.sedes=r[1]||[]; S.fichas=r[2]||[]; S.usuario=r[3]||"";
  if(r[4]) S.gh=Object.assign(S.gh,r[4]);
  if(r[5]) S.insp=Object.assign(S.insp,r[5]);
  S.seqs=r[6]||{};
  if(!S.proyectos.length) semilla();
  render();
  if(!DB) flash("Este equipo no guarda respaldo automático. Exporta el respaldo antes de cerrar.",true);
  else if(ghOn()) flash("Repositorio GitHub configurado. Toca el indicador de arriba para sincronizar.");
  else if(!hasSync()) flash("Modo local: los datos quedan en este dispositivo. Configura el repositorio GitHub o usa exportar e importar respaldo.");
});
})();
